name: treasure_box
description: "Minecraft-themed inventory app for a physical treasure box."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence (Drift / SQLite behind a repository)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Routing
  go_router: ^14.2.7

  # Optional real photo per item
  image_picker: ^1.1.2

  # Real NFC on mobile (behind NfcService; desktop/web use a stub)
  nfc_manager: ^3.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.4.0
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  archive: ^4.0.9
  http: ^1.6.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Drift code generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

# App icon: the chest itself (regenerate the PNGs with
# `flutter test test/tools/render_icon_test.dart --run-skipped`, then
# `flutter pub run flutter_launcher_icons`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon-full.png"
  adaptive_icon_background: "#17151D"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon-full.png"

flutter:
  uses-material-design: true

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
